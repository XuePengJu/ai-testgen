[pytest]
asyncio_mode = strict
# 统一 session 级事件循环：避免逐测试 Runner 建/关循环在个别 Python 补丁版本
# （3.13.14 服务器实测）上触发 "Runner.run() cannot be called from a running
# event loop" 的时序问题；本地与服务器行为保持一致。
asyncio_default_test_loop_scope = session
asyncio_default_fixture_loop_scope = session

testpaths = tests
markers =
    unit: 纯函数单测（零依赖，秒级）
    api: 接口层（进程内 TestClient）
    integration: 触及 DB/ORM 等真实资源（含在 api/ 内）
    e2e_ui: 浏览器端到端（需 backend:8005 + 已构建的 dist）
    inproc: 进程内驱动（TestClient），与层次 marker 组合使用
    live: 打真实 HTTP / 真实服务
    visual: 截图/视觉基线，非断言回归
    demo: 演示录屏，默认不执行
    slow: 重型用例（真实大模型全链路，耗时长，默认不执行）
    admin: 需 admin 起始态的 ui 用例（见 D10；不加则为 test 账户起始态）
    title(name): 用例中文可读名（供 junit / 回放页 / 报告消费；不改变 nodeid）
addopts =
    -m "not demo and not slow"
